<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLOCK</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main>
        <div class="container-clock">
            <div class="box-clock">
                <p id="h-digit-1">00</p>

                <p>:</p>
                <p id="m-digit-1">00</p>

                <p>:</p>
                <p id="s-digit-1">00</p>
            </div>    
            <div class="box-btn">
                <button type="button" class="btn" id="btn-stop">Start</button>
    
                <button type="button" class="btn" id="btn-reset">Reset</button>
            </div>
        </div>
    </main>


    <script src="./app.js"></script>
</body>

</html>
